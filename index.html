<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TIME LIMIT — 만료 시간 계산기</title>
  <style>
    :root{color-scheme:dark;--bg:#070b09;--panel:#101914;--line:#365441;--text:#e9f5ed;--muted:#bfd1c3;--green:#b8ffbf;--amber:#ffcc76;--red:#ff9a91}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100dvh;margin:0;background:radial-gradient(ellipse at 50% 42%,#122219 0,#070b09 62%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
    button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}
    .shell{width:min(100%,660px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.12em}.live{color:var(--green);font-weight:400}.live:before{content:"■ ";font-size:9px}
    main{flex:1;display:flex;flex-direction:column;justify-content:center}.intro{text-align:center}.mic{display:grid;place-items:center;width:156px;height:156px;margin:0 auto 28px;border:2px solid var(--green);border-radius:22px;background:#16301c;color:var(--green);box-shadow:0 0 0 9px #a4ffa80c,0 0 52px #72e67c27;transition:transform .15s,background .2s}.mic:active{transform:scale(.96)}.mic svg{width:68px;height:68px;fill:currentColor;shape-rendering:crispEdges}.mic.listening{background:#275633;animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 17px #a4ffa81a,0 0 72px #72e67c55}}
    h1{font-size:clamp(22px,6vw,32px);font-weight:400;letter-spacing:.06em;margin:0 0 12px;color:var(--green)}.hint{font-size:14px;color:var(--muted);line-height:1.7;margin:0}.status{min-height:23px;margin:16px auto 0;color:var(--amber);font-size:13px;line-height:1.5}
    .terminal{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px 20px 24px;box-shadow:0 20px 60px #0007}.head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:22px;font-size:12px;letter-spacing:.07em;color:var(--green)}.section{margin:0 0 23px}.label{font-size:12px;letter-spacing:.045em;color:var(--muted);margin:0 0 10px}.value{font-size:clamp(19px,5.1vw,26px);font-weight:400;line-height:1.4;letter-spacing:0;overflow-wrap:anywhere}.result{padding:18px 16px;background:#1b3323;border-left:4px solid var(--green);margin:5px 0 22px}.result .label{color:#d9e9dc}.result .value{font-size:clamp(22px,6.9vw,30px);font-weight:400;color:var(--green)}.result.warn{background:#382b1e;border-color:var(--amber)}.result.warn .value{color:var(--amber)}.result.bad{background:#3a2020;border-color:var(--red)}.result.bad .value{color:var(--red)}.secondary{font-size:14px;line-height:1.55;color:var(--muted);margin-top:8px}.note{font-size:12px;line-height:1.6;color:var(--amber);border-top:1px solid var(--line);padding-top:15px;margin:4px 0 0}.error{color:var(--amber);font-size:14px;line-height:1.7}
    textarea{display:block;width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#070e09;color:var(--text);padding:13px;line-height:1.6;font-size:16px}.actions{display:flex;gap:10px;margin-top:20px}.action{min-height:48px;padding:10px 16px;border:1px solid var(--green);border-radius:7px;background:#183621;color:var(--green);font-size:13px;font-weight:500}.action.alt{border-color:var(--line);background:transparent;color:var(--text)}.foot{text-align:center;color:#9db6a3;font-size:11px;line-height:1.6;letter-spacing:.025em;margin-top:22px}
    [hidden]{display:none!important}@media(max-width:390px){.shell{padding-left:16px;padding-right:16px}.terminal{padding:17px 15px}.mic{width:140px;height:140px}}
    @media(prefers-reduced-motion:reduce){.mic.listening{animation:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><span>TIME LIMIT / KST</span><span class="live">READY</span></header>
    <main>
      <section id="intro" class="intro">
        <button id="mic" class="mic" type="button" aria-label="음성 입력 시작">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 6h12v4h4v22h-4v4H26v-4h-4V10h4zm-4 22h-6v8h4v4h8v4h-8v4h24v-4h-8v-4h8v-4h4v-8h-6v8H22z"/></svg>
        </button>
        <h1>TIME LIMIT</h1>
        <p id="hint" class="hint">버튼을 누르고 시간 계산을 말씀해 주세요.<br>“9월 27일 15시 30분부터 40시간”</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
      <section id="output" class="terminal" hidden aria-label="계산 결과">
        <div class="head"><span>&gt; TIME LIMIT</span><span>KST / UTC+09</span></div>
        <div class="section"><label class="label" for="input">&gt; RECOGNIZED INPUT / 탭하여 수정</label><textarea id="input" spellcheck="false" autocomplete="off" placeholder="예: 27SEP2026 1530부터 40시간"></textarea></div>
        <div id="details" aria-live="polite"></div>
        <div class="actions"><button id="again" class="action" type="button">● 다시 말하기</button><button id="clear" class="action alt" type="button">처음으로</button></div>
      </section>
    </main>
    <footer class="foot">DDMMMYYYY hhmm · 모든 시간은 한국 시간 기준<br>음성 인식은 브라우저 기능을 사용합니다.</footer>
  </div>
  <script>
  (() => {
    'use strict';
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const monthPattern=MONTHS.join('|');
    const $=id=>document.getElementById(id);
    const intro=$('intro'),output=$('output'),status=$('status'),mic=$('mic'),hint=$('hint'),input=$('input'),details=$('details');
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    let recognition=null,listenTimer=null,endTimer=null,debounce=null;
    const pad=n=>String(n).padStart(2,'0');
    const display=ms=>{const d=new Date(ms+9*3600000);return `${pad(d.getUTCDate())}${MONTHS[d.getUTCMonth()]}${d.getUTCFullYear()} ${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}`};
    const durationText=mins=>`${Math.floor(Math.abs(mins)/60)}시간 ${pad(Math.abs(mins)%60)}분`;
    const section=(name,value,sub='')=>`<div class="section"><div class="label">&gt; ${name}</div><div class="value">${value}</div>${sub?`<div class="secondary">${sub}</div>`:''}</div>`;
    const banner=(name,value,sub='',cls='')=>`<div class="result ${cls}"><div class="label">&gt; ${name}</div><div class="value">${value}</div>${sub?`<div class="secondary">${sub}</div>`:''}</div>`;
    function kst(y,m,d,h,mi){
      if(!Number.isInteger(y)||y<1900||y>2100||m<1||m>12||d<1||d>31||h<0||h>23||mi<0||mi>59)throw Error('날짜 또는 시간이 올바르지 않습니다.');
      const base=Date.UTC(y,m-1,d,h,mi);
      const check=new Date(base);
      if(check.getUTCFullYear()!==y||check.getUTCMonth()!==m-1||check.getUTCDate()!==d)throw Error('해당 월에 존재하지 않는 날짜입니다.');
      return base-9*3600000;
    }
    function currentKst(){const d=new Date(Date.now()+9*3600000);return {year:d.getUTCFullYear(),month:d.getUTCMonth()+1};}
    function readClock(t){
      const s=t.trim().replace(/^[,，\s]+/,'');let h,mi=0,matched='';
      let m=s.match(/^(오전|오후|AM|PM)\s*(\d{1,2})\s*(?:시|:)(?:\s*(\d{1,2})\s*분?)?/i);
      if(m){h=+m[2];mi=+(m[3]||0);if(h<1||h>12)throw Error('오전·오후 시간은 1~12시로 입력해 주세요.');h=(h%12)+(m[1]==='오후'||/^PM$/i.test(m[1])?12:0);matched=m[0]}
      else if((m=s.match(/^(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분?)?/))){h=+m[1];mi=+(m[2]||0);matched=m[0]}
      else if((m=s.match(/^(\d{1,2}):(\d{2})\b/))){h=+m[1];mi=+m[2];matched=m[0]}
      else if((m=s.match(/^(\d{4})(?!\d)/))){h=+m[1].slice(0,2);mi=+m[1].slice(2);matched=m[0]}
      else if((m=s.match(/^(\d{1,2})\s*분/))){throw Error('날짜 뒤에 시각을 입력해 주세요. 예: 15시 30분')}
      else throw Error('날짜 뒤에 시각을 입력해 주세요. 예: 15시 30분 또는 1530');
      if(h>23||mi>59)throw Error('시간은 00~23시, 분은 00~59분으로 입력해 주세요.');
      return {h,mi,length:matched.length};
    }
    function parseDates(raw){
      const text=raw.toUpperCase().replace(/[.,]/g,' ');
      const matches=[];
      const eng=new RegExp(`(^|[^A-Z0-9])(\\d{1,2})\\s*(${monthPattern})\\s*(\\d{4})(?=\\s|$|[^A-Z0-9])`,'g');
      let m;
      while((m=eng.exec(text))){let start=m.index+m[1].length,end=eng.lastIndex;matches.push({start,end,d:+m[2],month:MONTHS.indexOf(m[3])+1,year:+m[4],explicitYear:true,explicitMonth:true})}
      const kor=/(?:([12]\d{3})\s*년\s*)?(?:(\d{1,2})\s*월\s*)?(\d{1,2})\s*일/g;
      while((m=kor.exec(text))){if(matches.some(v=>m.index>=v.start&&m.index<v.end))continue;matches.push({start:m.index,end:kor.lastIndex,d:+m[3],month:m[2]?+m[2]:null,year:m[1]?+m[1]:null,explicitYear:!!m[1],explicitMonth:!!m[2]})}
      matches.sort((a,b)=>a.start-b.start);
      if(!matches.length)throw Error('시작 날짜를 찾지 못했습니다. “9월 27일 15시 30분부터 40시간”처럼 말씀해 주세요.');
      if(matches.length>2)throw Error('날짜가 세 개 이상 인식되었습니다. 시작과 종료 두 시점만 입력해 주세요.');
      const now=currentKst();let prev=null;
      for(const item of matches){
        const after=text.slice(item.end).match(/^\s*/)[0].length;
        const clock=readClock(text.slice(item.end+after));item.end+=after+clock.length;
        item.month=item.month??(prev?prev.month:now.month);
        item.year=item.year??(prev?prev.year:now.year);
        if(prev&&!item.explicitYear&&item.explicitMonth&&item.month<prev.month)item.year++;
        item.ms=kst(item.year,item.month,item.d,clock.h,clock.mi);prev=item;
      }
      return matches;
    }
    function parseDuration(raw,dates){
      let clean=raw;for(const d of [...dates].reverse())clean=clean.slice(0,d.start)+' '.repeat(d.end-d.start)+clean.slice(d.end);
      const hours=[...clean.matchAll(/(\d+)\s*(?:시간|HOURS?|HRS?|HR|H)(?![A-Z])/gi)];
      const minutes=[...clean.matchAll(/(\d+)\s*(?:분|MINUTES?|MINS?|MIN|M)(?![A-Z])/gi)];
      if(hours.length>1||minutes.length>1)throw Error('제한시간은 한 번만 입력해 주세요. 예: 40시간 30분');
      if(!hours.length&&!minutes.length)return null;
      let total=(hours.length?+hours[0][1]*60:0)+(minutes.length?+minutes[0][1]:0);
      if(!Number.isSafeInteger(total)||total<=0||total>5256000)throw Error('제한시간은 1분 이상, 10년 이하로 입력해 주세요.');
      return total;
    }
    function calculate(raw){
      const dates=parseDates(raw),limit=parseDuration(raw,dates),start=dates[0],end=dates[1];
      if(!end&&limit===null)throw Error('제한시간이나 종료 시각을 말씀해 주세요. 예: 40시간 또는 28일 18시 15분까지');
      if(end&&end.ms<start.ms)throw Error('종료 시각이 시작 시각보다 빠릅니다. 연도·월·일을 확인해 주세요.');
      let html=section('START / 시작',display(start.ms));
      if(end)html+=section('END / 종료',display(end.ms));
      if(limit!==null)html+=section('LIMIT / 제한',durationText(limit));
      if(end){const elapsed=(end.ms-start.ms)/60000;
        html+=banner('ELAPSED / 경과',durationText(elapsed),`총 ${elapsed.toLocaleString('ko-KR')}분`);
        if(limit!==null){const left=limit-elapsed;html+=banner(left<0?'EXCEEDED / 제한 초과':left===0?'AT LIMIT / 제한 도달':'REMAINING / 잔여',durationText(left),left<0?'제한 시각을 지났습니다.':left===0?'제한 시각과 일치합니다.':'제한시간까지 남았습니다.',left<0?'bad':left===0?'warn':'')}
      }
      if(limit!==null)html+=banner('EXPIRES / 마지막 허용 시각',display(start.ms+limit*60000),'이 시각을 넘기면 제한시간 초과입니다.');
      if(dates.some(d=>!d.explicitYear||!d.explicitMonth))html+='<p class="note">※ 생략된 연도·월은 한국 시간의 현재 연월 또는 앞선 날짜를 기준으로 해석했습니다. START/END를 확인해 주세요.</p>';
      return html;
    }
    function render(){const raw=input.value.trim();if(!raw){details.innerHTML='<p class="error">인식된 문장을 입력하거나 수정해 주세요.</p>';return}try{details.innerHTML=calculate(raw)}catch(e){details.innerHTML=`<p class="error">⚠ ${e.message}</p>`}}
    function show(textValue){intro.hidden=true;output.hidden=false;input.value=textValue;render();window.scrollTo(0,0)}
    function resetMic(){mic.classList.remove('listening');mic.setAttribute('aria-label','음성 입력 시작');hint.innerHTML='버튼을 누르고 시간 계산을 말씀해 주세요.<br>“9월 27일 15시 30분부터 40시간”'}
    function fallback(message){resetMic();show(input.value||'');details.insertAdjacentHTML('afterbegin',`<p class="error">⚠ ${message}</p>`);input.focus()}
    function startListening(){
      if(!Recognition){fallback('이 브라우저에서는 음성 인식이 제공되지 않습니다. 키보드 마이크 또는 직접 입력을 사용해 주세요.');return}
      if(recognition){recognition.requestStop();return}
      let r;try{r=new Recognition();r.lang='ko-KR';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;recognition=r;
        let transcript='',error='',stopping=false,finished=false;
        const finish=()=>{
          if(finished)return;finished=true;clearTimeout(listenTimer);clearTimeout(endTimer);
          if(recognition!==r)return;recognition=null;resetMic();
          if(transcript){status.textContent='';show(transcript)}
          else{status.textContent=error||'인식된 말이 없습니다. 버튼을 눌러 다시 시도해 주세요.'}
        };
        r.requestStop=()=>{
          if(stopping||finished)return;stopping=true;clearTimeout(listenTimer);status.textContent='음성 인식을 마치는 중입니다…';
          try{r.stop()}catch{try{r.abort()}catch{}finish();return}
          endTimer=setTimeout(()=>{if(finished)return;try{r.abort()}catch{}finish()},2000);
        };
        r.onstart=()=>{
          if(recognition!==r)return;
          mic.classList.add('listening');mic.setAttribute('aria-label','음성 입력 종료');
          hint.textContent='듣는 중입니다. 말이 끝나면 자동으로 종료됩니다.';
          status.textContent='버튼을 다시 누르면 바로 종료합니다.';
          listenTimer=setTimeout(()=>{error='25초가 지나 인식을 종료했습니다. 다시 시도해 주세요.';r.requestStop()},25000);
        };
        r.onspeechend=()=>r.requestStop();
        r.onresult=e=>{transcript=e.results?.[0]?.[0]?.transcript?.trim()||transcript;r.requestStop()};
        r.onerror=e=>{
          error=e.error==='not-allowed'||e.error==='service-not-allowed'?'마이크 권한을 확인해 주세요.':e.error==='no-speech'?'음성이 들리지 않았습니다.':e.error==='network'?'음성 인식 연결에 실패했습니다.':'음성 인식을 사용할 수 없습니다.';
          clearTimeout(listenTimer);
          if(!stopping){try{r.abort()}catch{}endTimer=setTimeout(finish,2000)}
        };
        r.onend=finish;
        r.start();
      }catch{if(recognition===r)recognition=null;clearTimeout(listenTimer);clearTimeout(endTimer);fallback('음성 인식을 시작할 수 없습니다. 키보드 마이크 또는 직접 입력을 사용해 주세요.')}
    }
    mic.addEventListener('click',startListening);
    $('again').addEventListener('click',()=>{intro.hidden=false;output.hidden=true;status.textContent='';startListening()});
    $('clear').addEventListener('click',()=>{if(recognition){try{recognition.abort()}catch{}recognition=null}clearTimeout(listenTimer);clearTimeout(endTimer);input.value='';details.innerHTML='';output.hidden=true;intro.hidden=false;status.textContent='';resetMic()});
    input.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(render,130)});
  })();
  </script>
</body>
</html>
